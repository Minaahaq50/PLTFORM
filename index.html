<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>تسجيل الدخول | منصة احترافية</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDKs -->
    <script type="module">
        // تم تضمين Firebase مباشرة في script.js
    </script>
</head>
<body>
    <div class="background-overlay"></div>
    <div class="container">
        <div class="login-card">
            <div class="brand">
                <div class="logo">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <h1>مرحباً بك</h1>
                <p>سجل الدخول للوصول إلى لوحة التحكم</p>
            </div>

            <form id="loginForm">
                <div class="input-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" name="email" placeholder="example@company.com" required autocomplete="email">
                    <span class="input-icon">📧</span>
                </div>

                <div class="input-group">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                    <span class="input-icon">🔒</span>
                    <button type="button" id="togglePassword" class="toggle-pwd">👁️</button>
                </div>

                <div class="options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember"> تذكرني
                    </label>
                    <a href="#" id="forgotPassword" class="forgot-link">نسيت كلمة المرور؟</a>
                </div>

                <button type="submit" id="loginBtn" class="login-btn">
                    <span>تسجيل الدخول</span>
                    <div class="btn-spinner hidden"></div>
                </button>

                <div id="errorMessage" class="error-message hidden"></div>
                <div id="successMessage" class="success-message hidden"></div>
            </form>

            <div class="divider">
                <span>أو</span>
            </div>

            <button id="googleSignIn" class="social-btn">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                <span>الدخول باستخدام Google</span>
            </button>

            <div class="signup-prompt">
                ليس لديك حساب؟ <a href="#" id="showSignup">إنشاء حساب جديد</a>
            </div>
        </div>

        <!-- بطاقة التسجيل (hidden initially) -->
        <div class="login-card signup-card hidden">
            <div class="brand">
                <div class="logo">✨</div>
                <h1>إنشاء حساب</h1>
                <p>انضم إلى منصتنا اليوم</p>
            </div>

            <form id="signupForm">
                <div class="input-group">
                    <label for="signupName">الاسم الكامل</label>
                    <input type="text" id="signupName" placeholder="أحمد محمد">
                    <span class="input-icon">👤</span>
                </div>
                <div class="input-group">
                    <label for="signupEmail">البريد الإلكتروني</label>
                    <input type="email" id="signupEmail" placeholder="ahmed@example.com">
                    <span class="input-icon">📧</span>
                </div>
                <div class="input-group">
                    <label for="signupPassword">كلمة المرور</label>
                    <input type="password" id="signupPassword" placeholder="••••••••">
                    <span class="input-icon">🔒</span>
                </div>
                <button type="submit" id="signupBtn" class="login-btn">إنشاء حساب</button>
                <div id="signupError" class="error-message hidden"></div>
            </form>

            <div class="signup-prompt">
                لديك حساب بالفعل؟ <a href="#" id="showLogin">تسجيل الدخول</a>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
